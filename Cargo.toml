[package]
name = "cgrp"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
description = "Consent-driven group lifecycle state machine"
repository = "https://git.corbet.ch/corbet-foss/cgrp"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
schemars = "1"
ckmg = { git = "https://git.corbet.ch/corbet-foss/ckmg", branch = "main" }

[dev-dependencies]
futures = "0.3"
ed25519-dalek = "3"
postcard = { version = "1", default-features = false, features = ["alloc"] }
wasm-bindgen-test = "0.3"
